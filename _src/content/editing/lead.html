<p class="lead-p-intro">書籍企画を考える際、私は「必然性・社会性・資産性」という三つの軸を意識しています。なぜこの著者がこの本を書くのかという過去からの必然、いまの学術や社会にどう介入するのかという現在性、そして刊行後に著者・出版社・読者それぞれに何を残すのか、そしてその本で何をしていくのか、何がなされていってほしいか、何と接続されていってほしいか、という未来への持続性です。これらを著者・出版社・読者の三つの立場から考え、九つの観点から企画の輪郭を探ります。そのうえで、研究の核を損なわず専門領域の外へ射程を開き、書名、構成、目次、文章へと「読む・つくる理由」を具体化していくことを、編集の仕事だと考えています。</p>
