<svg width="100%" viewBox="0 0 680 860" role="img" style="max-width:100%;display:block">
<title>草野善太の問題関心図</title>
<style>
.th{font-family:'Shippori Mincho','Hiragino Mincho ProN',serif;font-size:12.5px;fill:#1a1a1a;font-weight:500}
.ts{font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif;font-size:10px;fill:#555}
.tl{font-family:'Noto Sans JP',sans-serif;font-size:10.5px;fill:#333}
.sep{stroke:#aaa;stroke-dasharray:4,3;stroke-width:0.8}
</style>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#1f5c20" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<!-- ① 情動・欲動（起点） -->
<rect x="200" y="16" width="280" height="48" rx="8" fill="#fdf6ee" stroke="#c8a060" stroke-width="1"/>
<text class="th" x="340" y="37" text-anchor="middle" dominant-baseline="central">情動・欲動</text>
<text class="ts" x="340" y="53" text-anchor="middle" dominant-baseline="central">理性的にどうしようもないもの</text>
<!-- ①→② -->
<path d="M340 64 L340 108" fill="none" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>
<text class="ts" x="355" y="89" fill="#999">媒介・操作</text>
<!-- ② 関心 interest（核心概念） -->
<rect x="170" y="108" width="340" height="56" rx="10" fill="#ede9f8" stroke="#534AB7" stroke-width="1.5"/>
<text class="th" x="340" y="130" text-anchor="middle" dominant-baseline="central" font-size="14">「関心 interest」</text>
<text class="ts" x="340" y="149" text-anchor="middle" dominant-baseline="central">神学・美学・統治論・経済学が共有した媒介操作概念</text>
<!-- ②→③思想史 -->
<path d="M340 164 L340 208" fill="none" stroke="#534AB7" stroke-width="1" marker-end="url(#arr)"/>
<text class="ts" x="356" y="189" fill="#888">思想史的変遷</text>
<!-- ③ 脱-関心の感性学 -->
<rect x="140" y="208" width="400" height="52" rx="10" fill="#ede9f8" stroke="#534AB7" stroke-width="1.2"/>
<text class="th" x="340" y="229" text-anchor="middle" dominant-baseline="central">脱-関心の感性学</text>
<text class="ts" x="340" y="246" text-anchor="middle" dominant-baseline="central">デュボス・ハチスン・ヒューム・スミス→ベンサム道徳論の再定位</text>
<!-- ③→左右分岐 -->
<path d="M240 260 L160 316" fill="none" stroke="#888" stroke-width="0.9" marker-end="url(#arr)"/>
<path d="M440 260 L530 316" fill="none" stroke="#888" stroke-width="0.9" marker-end="url(#arr)"/>
<!-- ④左：言語表象・視覚表象 -->
<rect x="30" y="316" width="250" height="68" rx="8" fill="#e6f3ef" stroke="#0F6E56" stroke-width="1"/>
<text class="th" x="155" y="338" text-anchor="middle" dominant-baseline="central">言語表象・視覚表象</text>
<text class="ts" x="155" y="355" text-anchor="middle" dominant-baseline="central">主体化（主客の措定・疎隔）</text>
<text class="ts" x="155" y="370" text-anchor="middle" dominant-baseline="central">世界化・世界の言語的分節</text>
<!-- ④右：統治・法 -->
<rect x="400" y="316" width="250" height="68" rx="8" fill="#f8ede9" stroke="#993C1D" stroke-width="1"/>
<text class="th" x="525" y="338" text-anchor="middle" dominant-baseline="central">統治・法</text>
<text class="ts" x="525" y="355" text-anchor="middle" dominant-baseline="central">情動・欲動の整流化</text>
<text class="ts" x="525" y="370" text-anchor="middle" dominant-baseline="central">快苦の計算可能化</text>
<!-- 左右→⑤通底（矢印を内側から中央へ） -->
<path d="M280 352 Q340 352 400 352" fill="none" stroke="#534AB7" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arr)"/>
<text class="ts" x="340" y="345" text-anchor="middle" fill="#534AB7">通底</text>
<!-- ④左→⑤ -->
<path d="M155 384 L220 432" fill="none" stroke="#888" stroke-width="0.9" marker-end="url(#arr)"/>
<!-- ④右→⑤ -->
<path d="M525 384 L460 432" fill="none" stroke="#888" stroke-width="0.9" marker-end="url(#arr)"/>
<!-- ⑤ 言語論と統治論の結節点 -->
<rect x="140" y="432" width="400" height="56" rx="10" fill="#fdf6ee" stroke="#c8a060" stroke-width="1.2"/>
<text class="th" x="340" y="453" text-anchor="middle" dominant-baseline="central">言語論と統治論の通底</text>
<text class="ts" x="340" y="470" text-anchor="middle" dominant-baseline="central">脱-関心の統治論化／言語による快苦の間接的計算可能化</text>
<!-- ⑤→⑥ -->
<path d="M340 488 L340 532" fill="none" stroke="#888" stroke-width="0.9" marker-end="url(#arr)"/>
<!-- ⑥ 存在論・フィクション論 -->
<rect x="140" y="532" width="400" height="56" rx="10" fill="#ede9f8" stroke="#534AB7" stroke-width="1"/>
<text class="th" x="340" y="553" text-anchor="middle" dominant-baseline="central">存在論・フィクション論</text>
<text class="ts" x="340" y="570" text-anchor="middle" dominant-baseline="central">リアル／フィクション内破・「存在もフィクション的実体」</text>
<!-- 区切り線 -->
<line x1="20" y1="612" x2="660" y2="612" class="sep"/>
<text class="ts" x="340" y="626" text-anchor="middle" fill="#999">現在の編集関心へ</text>
<!-- ⑥→第3層（4ノード） -->
<path d="M200 588 L100 660" fill="none" stroke="#aaa" stroke-width="0.7" stroke-dasharray="3,2" marker-end="url(#arr)"/>
<path d="M295 588 L260 660" fill="none" stroke="#aaa" stroke-width="0.7" stroke-dasharray="3,2" marker-end="url(#arr)"/>
<path d="M385 588 L430 660" fill="none" stroke="#aaa" stroke-width="0.7" stroke-dasharray="3,2" marker-end="url(#arr)"/>
<path d="M480 588 L590 660" fill="none" stroke="#aaa" stroke-width="0.7" stroke-dasharray="3,2" marker-end="url(#arr)"/>
<!-- 現在の編集関心4ノード -->
<rect x="20" y="660" width="165" height="52" rx="8" fill="#e6f3ef" stroke="#0F6E56" stroke-width="0.8"/>
<text class="th" x="103" y="679" text-anchor="middle" dominant-baseline="central">人間と動物</text>
<text class="ts" x="103" y="696" text-anchor="middle" dominant-baseline="central">言語活動・声・欲望と幻想</text>
<rect x="198" y="660" width="165" height="52" rx="8" fill="#ede9f8" stroke="#534AB7" stroke-width="0.8"/>
<text class="th" x="280" y="679" text-anchor="middle" dominant-baseline="central">宗教・スピリチュアリティ</text>
<text class="ts" x="280" y="696" text-anchor="middle" dominant-baseline="central">第三項・聖なるフィクション</text>
<rect x="376" y="660" width="165" height="52" rx="8" fill="#f8ede9" stroke="#993C1D" stroke-width="0.8"/>
<text class="th" x="458" y="679" text-anchor="middle" dominant-baseline="central">政治理論・現代思想</text>
<text class="ts" x="458" y="696" text-anchor="middle" dominant-baseline="central">規範・権力・統治性</text>
<rect x="554" y="660" width="110" height="52" rx="8" fill="#f0efee" stroke="#888780" stroke-width="0.8"/>
<text class="th" x="609" y="679" text-anchor="middle" dominant-baseline="central">心理学</text>
<text class="ts" x="609" y="696" text-anchor="middle" dominant-baseline="central">快苦の科学</text>
<!-- 凡例 -->
<rect x="20" y="740" width="10" height="10" rx="2" fill="#ede9f8" stroke="#534AB7"/>
<text class="ts" x="36" y="748" dominant-baseline="central">言語・存在論系</text>
<rect x="160" y="740" width="10" height="10" rx="2" fill="#e6f3ef" stroke="#0F6E56"/>
<text class="ts" x="176" y="748" dominant-baseline="central">感性・身体系</text>
<rect x="280" y="740" width="10" height="10" rx="2" fill="#f8ede9" stroke="#993C1D"/>
<text class="ts" x="296" y="748" dominant-baseline="central">政治・規範系</text>
<rect x="400" y="740" width="10" height="10" rx="2" fill="#fdf6ee" stroke="#c8a060"/>
<text class="ts" x="416" y="748" dominant-baseline="central">媒介・結節点</text>
<rect x="510" y="740" width="10" height="10" rx="2" fill="#f0efee" stroke="#888780"/>
<text class="ts" x="526" y="748" dominant-baseline="central">展開・派生</text>
</svg>
